# ===================================================================
# C.S.Ő EVENT - Backend Konfiguráció
# Csőneked Csapat · Debreceni Egyetem
# ===================================================================

spring.application.name=cso-event-backend
server.port=8080

# SQLite Adatbázis Kapcsolat (egyetlen cso_event.db adatbázisfájl a projekt gyökerében)
spring.datasource.url=jdbc:sqlite:cso_event.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# HikariCP Kapcsolatkezelő beállítások SQLite-hoz
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate beállítások SQLite-hoz
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Alapértelmezett bejelentkezési adatok és kezdő minták inicializálása
cso.data.init=true

# Naplózási szintek
logging.level.hu.unideb.szfm.csoneked=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
